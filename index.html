<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>条例助手 · 你只知道一两条，我们帮你把相关的找全</title>
<meta name="description" content="说出你的情况，把淘宝、京东规则里和你有关的条款全部找出来，分成「你可能已经知道的 / 你可能不知道的 / 对你有利的」，并指出条款没说清的地方。只引用平台原文，不给结论。" />
<style>
  /* ---------------------------------------------------------------
     条例助手 · 界面 v3
     设计判断：消费级工具界面（不是营销页），受众是普通消费者，
     基调「克制、可信、一眼看懂」；冷中性 + 单一深蓝强调，
     语义色（蓝/绿/橙）只用于三组状态，不用于装饰。
     形状：卡片 8px / 交互 6px，全站一致。
     --------------------------------------------------------------- */
  :root{
  /* 兜底：不支持 oklch 的浏览器退回这些 sRGB 值（值与 oklch 近似） */
  --bg: #f8f9fa;
  --sunken: #f2f4f6;
  --ink: #13161c;
  --ink-2: #4e5359;
  --ink-3: #686c72;
  --rule: #dbdee2;
  --rule-2: #ebedef;
  --accent: #28528e;
  --accent-hi: #15407e;
  --accent-wash: #e8f1fe;
  --fav: #076941;
  --warn: #a8372a;
  --warn-wash: #fff0e9;
    --bg:        oklch(0.982 0.002 255);
    --paper:     #ffffff;
    --sunken:    oklch(0.966 0.004 255);
    --ink:       oklch(0.20 0.012 258);
    --ink-2:     oklch(0.44 0.012 258);
    --ink-3:     oklch(0.53 0.010 258);   /* 2026-11-28：0.56 时对比度 4.42:1 不达 AA，0.53 → 下沉块 4.78:1 */
    --rule:      oklch(0.90 0.006 258);
    --rule-2:    oklch(0.945 0.004 258);
    --accent:    oklch(0.44 0.11 258);
    --accent-hi: oklch(0.38 0.115 258);
    --accent-wash: oklch(0.955 0.020 258);
    --fav:       oklch(0.46 0.105 158);
    --warn:      oklch(0.50 0.15 30);
    --warn-wash: oklch(0.968 0.024 40);
    --r: 8px; --r-in: 6px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI",
            "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    /* 衬线只用于「引用原文」，让引用和被解释的内容在视觉上分层 */
    --serif: "Songti SC", "Source Han Serif SC", Georgia, "SimSun", serif;
    --t: 160ms cubic-bezier(.22,1,.36,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0 }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth }
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.72;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    padding:0 20px 96px; display:flex; justify-content:center;
  }
  .app{ width:100%; max-width:680px }
  a{ color:var(--accent) }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px }

  /* ---------- 顶栏：单行 56px ---------- */
  nav{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    height:56px; border-bottom:1px solid var(--rule);
  }
  .mark{ font-size:14.5px; font-weight:650; letter-spacing:-.005em; display:flex; align-items:center; gap:9px }
  .mark i{ width:15px; height:15px; border-radius:3px; display:block; background:var(--accent); position:relative }
  .mark i::after{ content:""; position:absolute; left:4px; top:4px; width:7px; height:7px; border-radius:1.5px; background:var(--bg) }
  .navmeta{ font-size:12.5px; color:var(--ink-3); display:flex; align-items:center; gap:6px; white-space:nowrap }
  .navmeta b{ color:var(--ink-2); font-weight:600; font-variant-numeric:tabular-nums }

  /* ---------- Hero ---------- */
  header{ padding:44px 0 0 }
  h1{ font-size:31px; line-height:1.24; font-weight:680; letter-spacing:-.028em; margin-bottom:12px }
  h1 em{ font-style:normal; color:var(--accent) }
  .lede{ font-size:15.5px; color:var(--ink-2); max-width:34em; margin-bottom:26px }

  /* ---------- 输入 ---------- */
  .field>label{ display:block; font-size:12.5px; color:var(--ink-3); letter-spacing:.01em; margin-bottom:8px }
  textarea{
    width:100%; min-height:92px; resize:vertical; padding:14px 15px;
    font:inherit; color:var(--ink); background:var(--paper);
    border:1px solid var(--rule); border-radius:var(--r);
    transition:border-color var(--t), box-shadow var(--t);
  }
  textarea::placeholder{ color:var(--ink-3) }
  textarea:hover{ border-color:oklch(0.80 0.008 258) }
  textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash) }

  .chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:11px }
  .chip{
    font:inherit; font-size:13px; cursor:pointer; color:var(--ink-2);
    background:transparent; border:1px solid var(--rule-2); border-radius:99px;
    padding:5px 11px; transition:all var(--t);
  }
  .chip:hover{ background:var(--sunken); color:var(--ink); border-color:var(--rule) }
  .chip:active{ transform:translateY(1px) }

  .actions{ display:flex; align-items:center; gap:14px; margin-top:20px; flex-wrap:wrap }
  .btn{
    font:inherit; font-size:14px; font-weight:550; cursor:pointer; white-space:nowrap;
    border-radius:var(--r-in); border:1px solid var(--rule);
    background:var(--paper); color:var(--ink); padding:10px 20px;
    transition:background var(--t), border-color var(--t), transform var(--t);
  }
  .btn:hover{ background:var(--sunken) }
  .btn:active{ transform:translateY(1px) }
  .btn:disabled{ opacity:.42; cursor:default; transform:none }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff }
  .btn.primary:hover{ background:var(--accent-hi); border-color:var(--accent-hi) }
  .note{ font-size:12.5px; color:var(--ink-3) }

  /* ---------- 三步说明 ---------- */
  .steps{
    display:grid; grid-template-columns:repeat(3,1fr);
    margin-top:44px; border-top:1px solid var(--rule); padding-top:22px;
  }
  .step{ padding-right:18px }
  .step+.step{ border-left:1px solid var(--rule-2); padding-left:18px }
  .step .n{ font-size:11.5px; color:var(--accent); font-weight:650; letter-spacing:.06em }
  .step h3{ font-size:14px; font-weight:620; margin:6px 0 4px }
  .step p{ font-size:13px; color:var(--ink-3); line-height:1.6 }

  /* ---------- 结果区 ---------- */
  #out{ margin-top:38px }

  .bar{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    padding-bottom:12px; border-bottom:1.5px solid var(--ink); flex-wrap:wrap;
  }
  .bar h2{ font-size:17px; font-weight:660; letter-spacing:-.012em }
  .bar .lib{ font-size:12.5px; color:var(--ink-3) }
  .bar .lib a{ color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-wash) }

  .situation{
    background:var(--sunken); border-radius:var(--r); padding:14px 16px; margin-top:16px;
    font-size:14px; line-height:1.66;
  }
  .situation .lbl{ font-size:11.5px; color:var(--ink-3); letter-spacing:.03em; margin-bottom:5px }
  .situation .tags{ font-size:12.5px; color:var(--ink-2); margin-top:9px; padding-top:9px; border-top:1px solid var(--rule) }
  .situation .tags b{ color:var(--ink); font-weight:600 }

  /* 三组：组头吸顶，滚动时知道自己在第几组 */
  .group{ margin-top:32px }
  .group-h{
    display:flex; align-items:center; gap:9px; padding:6px 0 8px;
    position:sticky; top:0; z-index:5;
    background:var(--bg);   /* 实底：吸顶时不透出下面的内容 */
  }
  .dot{ width:7px; height:7px; border-radius:99px; flex:0 0 auto }
  .dot.know{ background:var(--ink-3) }
  .dot.unk{ background:var(--accent) }
  .dot.fav{ background:var(--fav) }
  .dot.gap{ background:var(--warn) }
  .group-h h3{ font-size:14px; font-weight:640; letter-spacing:-.005em }
  .group-h .cnt{ font-size:12px; color:var(--ink-3); margin-left:auto; font-variant-numeric:tabular-nums }
  .group-sub{ font-size:12.5px; color:var(--ink-3); margin:0 0 6px 16px }

  .items{ border-top:1px solid var(--rule-2); margin-top:10px }
  .it{ padding:14px 0 14px 15px; border-bottom:1px solid var(--rule-2); border-left:2px solid transparent }
  .it.unk{ border-left-color:var(--accent) }
  .it.fav{ border-left-color:var(--fav) }
  .it .art{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-3); letter-spacing:.02em; margin-bottom:6px }
  .it .art .badge{ font-size:10.5px; letter-spacing:0; color:var(--ink-3); border:1px solid var(--rule); border-radius:3px; padding:0 4px; line-height:1.5 }
  .it .q{ font-family:var(--serif); font-size:14.5px; line-height:1.84; color:var(--ink); text-wrap:pretty }
  .it .why{ font-size:13px; color:var(--ink-2); margin-top:9px; padding-left:12px; border-left:1px solid var(--rule) }
  .it .why::before{ content:"和你的情况的关系"; display:block; font-size:10.5px; color:var(--ink-3); letter-spacing:.05em; margin-bottom:2px }

  /* 表格类信息：小 pill，不塞进句子里 */
  .tbl{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px }
  .tbl span{ font-size:11.5px; color:var(--ink-2); background:var(--sunken); border-radius:4px; padding:2px 7px }
  .tbl span b{ color:var(--ink); font-weight:600 }

  .callout{ border-radius:var(--r); padding:14px 16px; font-size:14px; line-height:1.66 }
  .callout.gap{ background:var(--warn-wash); color:var(--ink) }
  .callout.gap .t{ font-size:11.5px; font-weight:650; color:var(--warn); letter-spacing:.03em; display:block; margin-bottom:4px }

  ol.adv{ margin-top:10px; padding-left:0; list-style:none; counter-reset:s; border-top:1px solid var(--rule-2) }
  ol.adv li{
    counter-increment:s; position:relative; padding:11px 0 11px 30px;
    border-bottom:1px solid var(--rule-2); font-size:14px; line-height:1.66;
  }
  ol.adv li::before{
    content:counter(s); position:absolute; left:0; top:12px;
    width:19px; height:19px; border-radius:99px; background:var(--sunken);
    color:var(--ink-2); font-size:11.5px; font-weight:650;
    display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;
  }

  .foot{ margin-top:26px; padding-top:14px; border-top:1px solid var(--rule); font-size:12px; color:var(--ink-3); line-height:1.66 }
  .foot .src a{ color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-wash) }

  /* ---------- 加载 / 空 / 错误 ---------- */
  .loading{ padding:16px 0 }
  .loading .stage{ display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink-2); min-height:26px }
  .loading .stage i{ width:13px; height:13px; border-radius:99px; border:1.5px solid var(--rule); border-top-color:var(--accent); animation:spin .8s linear infinite; flex:0 0 auto }
  .loading .stage.done i{ border-color:var(--fav); animation:none }
  .loading .stage.done{ color:var(--ink-3) }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .sk{ height:11px; border-radius:3px; background:var(--sunken); margin-top:12px; animation:pulse 1.5s ease-in-out infinite }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.5 } }

  .empty{ border:1px dashed var(--rule); border-radius:var(--r); padding:22px 20px; text-align:center }
  .empty b{ display:block; font-size:14.5px; margin-bottom:6px }
  .empty p{ font-size:13px; color:var(--ink-3); line-height:1.66; max-width:36em; margin:0 auto }
  .empty .libs{ font-size:12.5px; color:var(--ink-2); margin-top:10px }
  .err{ background:var(--warn-wash); border-radius:var(--r); padding:14px 16px; font-size:14px }
  .err b{ color:var(--warn) }
  .err .btn{ margin-top:10px }

  /* ---------- 移动端：输入固定底部，拇指可达 ---------- */
  @media (max-width:560px){
    body{ padding:0 16px 132px }
    h1{ font-size:25px }
    .lede{ font-size:14.5px }
    header{ padding-top:32px }
    .steps{ grid-template-columns:1fr }
    .step{ padding:12px 0; border-bottom:1px solid var(--rule-2) }
    .step+.step{ border-left:none; padding-left:0 }
    .composer{
      position:fixed; left:0; right:0; bottom:0; z-index:20;
      background:oklch(0.982 0.002 255 / .97);
      border-top:1px solid var(--rule); padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    }
    .composer .field>label, .composer .chips{ display:none }
    .composer textarea{ min-height:44px; height:44px; padding:11px 13px; resize:none }
    .composer .actions{ margin-top:8px }
    .composer .note{ display:none }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none!important; transition:none!important; scroll-behavior:auto!important }
  }
  @media print{
    nav,.composer,.steps,.actions,.chips{ display:none!important }
    body{ padding:0 }
    .group-h{ position:static }
  }

  .demo-banner{
    background:oklch(0.955 0.020 258); color:oklch(0.40 0.09 258);
    font-size:12.5px; line-height:1.6; padding:9px 20px; text-align:center;
    border-bottom:1px solid oklch(0.90 0.006 258);
  }
  .demo-banner b{ font-weight:650; color:oklch(0.40 0.11 258) }
</style>
</head>
<body>
<div class="app">
<div class="demo-banner"><b>离线演示版</b>　下面 11 个案例的结果由 DeepSeek 真实生成后冻结，页面不调用任何接口；换成自己的问题不会现算，会提示你点示例。</div>

  <nav>
    <div class="mark"><i></i>条例助手</div>
    <div class="navmeta" id="navmeta">加载中</div>
  </nav>

  <main>
  <header>
    <h1>你只知道一两条，<br>我们帮你<em>把相关的找全</em></h1>
    <p class="lede">说出你的情况。把淘宝、京东规则里和你有关的条款找出来，分成你已知道的、你可能不知道的、以及对你有利的。</p>

    <div class="composer">
      <div class="field">
        <label for="q">你的情况</label>
        <textarea id="q" rows="3" placeholder="例：淘宝买的牛仔裤，吊牌剪了，试穿发现太长想退"></textarea>
      </div>
      <div class="chips" id="chips"></div>
      <div class="actions">
        <button class="btn primary" id="go">查看相关条款</button>
        <span class="note">只引用平台自己写的规则，不引法条，不下结论</span>
      </div>
    </div>
  </header>

  <section class="steps">
    <div class="step">
      <div class="n">01</div>
      <h3>说清情况</h3>
      <p>在哪买的、买了什么、现在什么状态。</p>
    </div>
    <div class="step">
      <div class="n">02</div>
      <h3>找到条款</h3>
      <p>从已收录的条例里，把相关的逐条摘出来。</p>
    </div>
    <div class="step">
      <div class="n">03</div>
      <h3>看清边界</h3>
      <p>哪些对你有利、哪些没说清、下一步做什么。</p>
    </div>
  </section>

  <section id="out" aria-live="polite"></section>
  </main>
</div>


<script>
/* ===== 离线演示垫片：接管 /api/libs 与 /api/ask，界面代码原样复用 ===== */
(function(){

担。", "why": "这条讲的是约定优先，以及责任归属无法确定时淘宝可能按交易习惯处理或支持退货退款，对你和卖家协商或平台介入有参考作用。", "article": "第七条"}], "unclear": "吊牌剪了是否一定导致“商品不完好”，条款没有直接写明；试穿发现太长是否属于“基于查验需要”的合理调试，条款也没有明确界定。另外，商品详情页是否带有“7天无理由退货”服务标识，需要你自行确认。", "advice": ["先查看商品详情页的服务保障栏，确认这件牛仔裤是否带有“7天无理由退货”服务标识。", "在签收商品之日起七天内（自物流显示签收的次日零时起算）在线发起退货申请，不要超过时限。", "和卖家沟通时，说明是试穿后发现太长、属于查验需要，并询问吊牌已剪是否影响退货；保留好聊天记录和商品照片。", "如果卖家拒绝，可以申请淘宝平台介入，提交商品详情页截图、聊天记录和能证明商品现状的照片。"], "disclaimer": "以上为平台规则原文摘录与理解，不构成法律意见。最终以平台判定为准。", "_dedup_removed": 0, "_checks": {"quote_ok": true, "bad_words": [], "sanitized": 0, "repaired": 0, "dropped": 0, "n_quote_sources": 28, "n_clauses": 28, "n_known": 2, "n_unknown": 3, "n_favorable": 3}}}}, {"q": "淘宝买的耳机，拆封了发现不喜欢", "a": {"ok": true, "routed": true, "lib": "淘宝网七天无理由退货规范 + 淘宝平台争议处理规则", "lib_url": "https://rulechannel.taobao.com/?type=detail&ruleId=5507&cId=1150#/rule/detail?ruleId=5507&cId=1150", "sit": {"item": "耳机", "channel": "淘宝", "state": "拆封", "want": null}, "res": {"situation": "你在淘宝买了耳机，拆封后发现不喜欢，想了解能否适用七天无理由退货。", "known": [{"id": "T1", "quote": "“七天无理由退货”服务是指买家购买带有“7天无理由退货”服务标识的商品后，自签收商品之日起七天内，对支持七天无理由退货并符合完好标准的商品，可向卖家发起七天无理由退货申请，卖家在规定时效内向买家提供退货的售后保障服务。", "why": "这是七天无理由退货的基本定义，说明需要商品带有服务标识、在签收后七天内、且商品符合完好标准。", "article": "第一条"}, {"id": "T3", "quote": "选择无理由退货的买家应当自收到商品之日起七天内向淘宝网卖家发出退货申请（自物流显示签收商品的次日零时起计算，满168小时为七天）；买家退回的商品应当完好。", "why": "这条讲的是申请时限和商品完好的要求，和你拆封后想退货直接相关。", "article": "第三条"}], "unknown": [{"id": "T2", "quote": "支持七天无理由退货的商品，在商品详情页的服务保障栏会带服务标识，具体以商品详情页展示为准。", "why": "你可能没注意商品详情页是否有“7天无理由退货”标识，这会影响能否直接适用该服务。", "article": "第二条"}, {"id": "I1", "quote": "商品能够保持原有品质、功能；买家应当确保退回商品和相关配（附）件（如吊牌、说明书、三包卡等）齐全，并保持原有品质、功能，无受损、受污、刮开防伪、产生激活（授权）等情形，无难以恢复原状的外观类使用痕迹、不合理的个人数据使用痕迹；", "why": "这条列出了完好的具体标准，包括配件齐全、无使用痕迹等，你可能需要对照检查耳机状态。", "article": "实施细则 · 通用完好标准（一）"}, {"id": "T6B", "quote": "九、一经激活或者试用后价值贬损较大的商品，商用商品，或者短期内价值频繁波动的商品；智能商品、商用厨电、黄金等；十、拆封后影响人身安全或者生命健康的商品，或者拆封后易导致商品品质发生改变的商品；食品、保健品、贴身用品、成人用品、酒水等；", "why": "耳机可能涉及“一经激活或者试用后价值贬损较大”的情形，卖家可选支持七天无理由，但并非必须。", "article": "第六条 · 卖家可选支持的 2 类"}, {"id": "T5", "quote": "买家进行七天无理由退货时，若商品卖家包邮，买家仅承担退回邮费；若商品未包邮或系卖家附条件包邮的，买家部分退货致使无法满足包邮条件的，由买家承担所有邮费。双方另有约定的从约定；买家存在滥用会员权利行为的，所有运费均由买家承担。", "why": "这条讲的是退货运费由谁承担，你可能需要关注卖家是否包邮。", "article": "第五条"}], "favorable": [{"id": "I2", "quote": "买家基于查验需要而打开商品包装，或者为确认商品的品质、功能而进行合理的调试不影响商品的完好。对超出查验和确认商品品质、功能需要而使用商品，导致商品价值贬损较大的，视为商品不完好；", "why": "这条明确拆封查验本身不影响完好，对你拆封后想退货的情况有支持作用，但前提是未超出查验范围使用。", "article": "实施细则 · 通用完好标准（二）"}, {"id": "T6C", "quote": "十一、除以上十类商品外的所有品类商品，均需支持“七天无理由退货”。服装服饰(除贴身用品)、食品类（非鲜活易腐类的）数码产品及配件、家纺居家日用、母婴用品（除食品、贴身用品）、宠物用品（除食品、药品）、图书、珠宝钻石类、家具、家电等。", "why": "耳机属于数码产品及配件，原则上在必须支持七天无理由退货的范围内，对你有利。", "article": "第六条 · 必须支持的（其余所有品类）"}, {"id": "T4", "quote": "赠品遗失或破损、发票遗失不影响商品退货；赠品破损或遗失作折价处理，发票遗失由买家承担相应税款；淘宝网要求支持七天无理由退货的商品，卖家单方或买卖双方约定不支持七天无理由退货的行为无效，但平台以普通人认知判断买家为非生活消费所需购买的情形除外。鼓励卖家向买家提供更优于淘宝网要求的七天无理由退货要求。", "why": "这条说明卖家单方约定不支持七天无理由退货的行为无效（除非被认定为非生活消费），对你主张权利有支持作用。", "article": "第四条"}], "unclear": "商品详情页是否带有“7天无理由退货”服务标识；耳机是否属于“一经激活或者试用后价值贬损较大”的商品（卖家可选支持）；拆封后是否仅进行了查验，还是已使用导致价值贬损；是否在签收后七天内。", "advice": ["先查看商品详情页的服务保障栏，确认是否有“7天无理由退货”标识。", "检查耳机及配件是否齐全、有无使用痕迹，确保商品保持完好（仅拆封查验通常不影响）。", "在签收后七天内通过淘宝平台发起退货申请，并注意退货运费承担规则。"], "disclaimer": "以上为平台规则原文摘录与理解，不构成法律意见。最终以平台判定为准。", "_dedup_removed": 0, "_checks": {"quote_ok": true, "bad_words": [], "sanitized": 0, "repaired": 0, "dropped": 0, "n_quote_sources": 28, "n_clauses": 28, "n_known": 2, "n_unknown": 4, "n_favorable": 3}}}}, {"q": "淘宝退货后，商家说外观有划痕要扣钱", "a": {"ok": true, "routed": true, "lib": "淘宝网七天无理由退货规范 + 淘宝平台争议处理规则", "lib_url": "https://rulechannel.taobao.com/?type=detail&ruleId=5507&cId=1150#/rule/detail?ruleId=5507&cId=1150", "sit": {"item": null, "channel": "淘宝", "state": "退货后商家称外观有划痕", "want": "退货"}, "res": {"situation": "你在淘宝购买商品后申请了退货，退货后商家以商品外观有划痕为由要求扣钱。", "known": [{"id": "I1", "quote": "商品能够保持原有品质、功能；买家应当确保退回商品和相关配（附）件（如吊牌、说明书、三包卡等）齐全，并保持原有品质、功能，无受损、受污、刮开防伪、产生激活（授权）等情形，无难以恢复原状的外观类使用痕迹、不合理的个人数据使用痕迹；", "why": "商家常说的“外观有划痕”可能对应这里的“无受损、受污……无难以恢复原状的外观类使用痕迹”，这是判断商品是否完好的标准之一。", "article": "实施细则 · 通用完好标准（一）"}], "unknown": [{"id": "T3", "quote": "选择无理由退货的买家应当自收到商品之日起七天内向淘宝网卖家发出退货申请（自物流显示签收商品的次日零时起计算，满168小时为七天）；买家退回的商品应当完好。", "why": "你可能没注意，七天无理由退货要求退回的商品应当完好，商家扣钱的理由正是基于“完好”这一条件。", "article": "第三条"}, {"id": "TBZ8", "quote": "争议过程中，买卖双方应按本规则规定进行举证。本规则未有规定或淘宝发现双方的交易或一方账号异常的，淘宝将视双方实际情形作出举证责任分配。", "why": "你可能没注意，争议中双方都需要举证，商家称有划痕也需要提供证据，你可以准备自己这边的证据。", "article": "第八条"}, {"id": "TBZ9", "quote": "买卖双方应自行对证据的真实性、关联性、完整性、准确性和及时性负责，淘宝将基于普通人的认知，根据该等证据作出纠纷责任的归属认定及纠纷调处的结论。", "why": "这条讲的是证据要求，淘宝会根据双方证据来判断责任归属，划痕是否存在、谁造成的都可能影响结论。", "article": "第九条"}], "favorable": [{"id": "I2", "quote": "买家基于查验需要而打开商品包装，或者为确认商品的品质、功能而进行合理的调试不影响商品的完好。对超出查验和确认商品品质、功能需要而使用商品，导致商品价值贬损较大的，视为商品不完好；", "why": "这条对你有利的地方在于：基于查验需要的打开包装或合理调试不影响完好，如果划痕是在你正常查验过程中产生或原本就存在，可能不被视为不完好。", "article": "实施细则 · 通用完好标准（二）"}, {"id": "I3", "quote": "商品原包装未缺失，包装整体结构完整。但在包装运输或拆卸过程中产生的难以避免的形态变化，如适度的变形、污渍、局部破损等，不认定其影响商品包装完整。", "why": "这条对你有利的地方在于：运输或拆卸过程中难以避免的形态变化（如适度变形、污渍、局部破损）不认定影响包装完整，如果划痕属于这类轻微形态变化，可能不被认定为问题。", "article": "实施细则 · 一般商品包装的完整标准"}, {"id": "TBZ11", "quote": "除特殊规定外，交易做退货退款处理的，或卖家同意退货协议但无确切证据证明卖家有责的，买家将退货商品交付承运人后，商品的破损风险由卖家承担；商品的损毁、灭失风险由买家承担，买家有权向承运人求偿。卖家在同意退货协议时附有合理条件的，买家退货应符合该条件。", "why": "这条对你有利的地方在于：你将退货商品交付承运人后，商品的破损风险由卖家承担，如果划痕是运输中产生的破损，可能不由你负责。", "article": "第十一条"}, {"id": "TBZ13", "quote": "卖家表述的对买家有重大利害关系的格式条款内容应显著，且不得低于淘宝平台规则要求，同时不存在免除卖家自身应承担的责任、加重买家责任、排除买家主要权利等内容，否则该条款无效。", "why": "这条对你有利的地方在于：如果商家用单方声明（如“外观划痕一律扣钱”）来扣款，该声明若加重你的责任或排除你的主要权利，可能无效。", "article": "第十三条"}], "unclear": "条款没有明确“外观划痕”达到什么程度才算商品不完好，也没有规定商家扣钱的具体标准和举证要求；另外，划痕是商品本身还是包装上的、是你造成还是运输造成，这些事实需要你确认。", "advice": ["保存好退货时的商品照片、视频，以及物流签收记录，证明退货时商品状态。", "要求商家提供划痕的具体照片和证据，并说明划痕是在何时发现的。", "如果划痕是运输造成的，可依据退货运输风险划分的相关条款与商家或平台沟通。", "在淘宝平台发起维权，提交你的证据，由平台基于双方证据判断责任归属。"], "disclaimer": "以上为平台规则原文摘录与理解，不构成法律意见。最终以平台判定为准。", "_dedup_removed": 0, "_checks": {"quote_ok": true, "bad_words": [], "sanitized": 0, "repaired": 0, "dropped": 0, "n_quote_sources": 28, "n_clauses": 28, "n_known": 1, "n_unknown": 3, "n_favorable": 4}}}}, {"q": "淘宝卖家详情页写了不支持七天无理由，我能退吗", "a": {"ok": true, "routed": true, "lib": "淘宝网七天无理由退货规范 + 淘宝平台争议处理规则", "lib_url": "https://rulechannel.taobao.com/?type=detail&ruleId=5507&cId=1150#/rule/detail?ruleId=5507&cId=1150", "sit": {"item": null, "channel": "淘宝", "state": null, "want": "退货"}, "res": {"situation": "你在淘宝买了商品，卖家在详情页写了不支持七天无理由退货，你想知道这种情况下还能不能退货。", "known": [{"id": "T2", "quote": "支持七天无理由退货的商品，在商品详情页的服务保障栏会带服务标识，具体以商品详情页展示为准。", "why": "商家详情页写“不支持七天无理由”，就是依据这条展示服务标识的做法，你看到的正是这个标识。", "article": "第二条"}, {"id": "T1", "quote": "“七天无理由退货”服务是指买家购买带有“7天无理由退货”服务标识的商品后，自签收商品之日起七天内，对支持七天无理由退货并符合完好标准的商品，可向卖家发起七天无理由退货申请，卖家在规定时效内向买家提供退货的售后保障服务。", "why": "这条讲的是七天无理由退货服务的前提是商品带有该服务标识，你遇到的是没有这个标识的情况。", "article": "第一条"}], "unknown": [{"id": "T6A", "quote": "一、买家定作的，定制类商品；个性定制、设计服务；二、鲜活易腐类商品；鲜花绿植、水产肉类、新鲜蔬果、宠物、巧克力、月饼、粽子、速冻冷鲜类食品等；三、在线下载或者买家拆封的音像制品，计算机软件等数字化商品；网游、话费、数字阅读、网络服务、电子凭证；四、交付的报纸、期刊；订阅的报纸、期刊；五、服务类商品；本地服务、代购服务；六、个人闲置类物品；/七、二手、竞拍商品；/八、人体用药", "why": "这条列举了本身就不支持七天无理由退货的几类商品，如果你的商品属于其中某一类，卖家写“不支持”就和平台分类一致。", "article": "第六条 · 不支持七天无理由退货的 8 类"}, {"id": "T6B", "quote": "九、一经激活或者试用后价值贬损较大的商品，商用商品，或者短期内价值频繁波动的商品；智能商品、商用厨电、黄金等；十、拆封后影响人身安全或者生命健康的商品，或者拆封后易导致商品品质发生改变的商品；食品、保健品、贴身用品、成人用品、酒水等；", "why": "这条讲的是卖家可以选择不支持七天无理由退货的两类商品，如果你的商品属于这两类，卖家写“不支持”属于平台允许的选择。", "article": "第六条 · 卖家可选支持的 2 类"}, {"id": "TBZ7", "quote": "买卖双方就交易商品或服务有约定的，优先从约定；未约定或约定不明的，双方可协议补充；无法达成补充协议的，淘宝将按照本规则进行处理，本规则有特别规定的优先从特别规定。若仍无法确定争议责任归属的，淘宝将按照交易习惯处理或支持退货退款。支持退货退款的，发货运费由卖家承担，退货运费由买家承担。", "why": "这条讲的是有约定优先从约定，以及约定不明时平台的处理顺序，和你详情页的“不支持”约定与平台规则之间的关系有关。", "article": "第七条"}, {"id": "T3", "quote": "选择无理由退货的买家应当自收到商品之日起七天内向淘宝网卖家发出退货申请（自物流显示签收商品的次日零时起计算，满168小时为七天）；买家退回的商品应当完好。", "why": "这条讲的是七天无理由退货的时间起算和商品完好要求，如果你要主张退货，时间和商品状态是相关因素。", "article": "第三条"}, {"id": "I1", "quote": "商品能够保持原有品质、功能；买家应当确保退回商品和相关配（附）件（如吊牌、说明书、三包卡等）齐全，并保持原有品质、功能，无受损、受污、刮开防伪、产生激活（授权）等情形，无难以恢复原状的外观类使用痕迹、不合理的个人数据使用痕迹；", "why": "这条讲的是商品完好的具体标准，和你退回的商品状态是否影响退货有关。", "article": "实施细则 · 通用完好标准（一）"}, {"id": "I2", "quote": "买家基于查验需要而打开商品包装，或者为确认商品的品质、功能而进行合理的调试不影响商品的完好。对超出查验和确认商品品质、功能需要而使用商品，导致商品价值贬损较大的，视为商品不完好；", "why": "这条讲的是拆封查验的边界，你如果只是打开包装查看，和商品是否被认定为完好有关。", "article": "实施细则 · 通用完好标准（二）"}], "favorable": [{"id": "T4", "quote": "淘宝网要求支持七天无理由退货的商品，卖家单方或买卖双方约定不支持七天无理由退货的行为无效，但平台以普通人认知判断买家为非生活消费所需购买的情形除外。", "why": "这条对你有利的地方是：如果商品属于平台要求必须支持七天无理由退货的品类，卖家单方写“不支持”可能不产生效力，但要注意例外情形。", "article": "第四条"}, {"id": "TBZ13", "quote": "卖家表述的对买家有重大利害关系的格式条款内容应显著，且不得低于淘宝平台规则要求，同时不存在免除卖家自身应承担的责任、加重买家责任、排除买家主要权利等内容，否则该条款无效。", "why": "这条对你有利的地方是：卖家详情页的格式条款如果低于平台规则要求或排除你的主要权利，该条款可能无效。", "article": "第十三条"}, {"id": "T6C", "quote": "十一、除以上十类商品外的所有品类商品，均需支持“七天无理由退货”。服装服饰(除贴身用品)、食品类（非鲜活易腐类的）数码产品及配件、家纺居家日用、母婴用品（除食品、贴身用品）、宠物用品（除食品、药品）、图书、珠宝钻石类、家具、家电等。", "why": "这条对你有利的地方是：它明确了除十类商品外的所有品类都需支持七天无理由退货，如果你的商品不在那十类里，卖家写“不支持”就和平台要求不一致。", "article": "第六条 · 必须支持的（其余所有品类）"}], "unclear": "你买的商品具体是什么品类，条款里没有信息，需要你确认；商品是否属于平台要求必须支持七天无理由退货的品类，以及是否落在卖家可选不支持或本身不支持的类别里，需要结合商品实际情况判断；详情页“不支持七天无理由”的表述是否显著、是否低于平台规则要求，也需要看具体展示情况。", "advice": ["先确认你买的商品属于什么品类，对照平台规则里必须支持、卖家可选支持、本身不支持的三类范围，看你的商品落在哪一类。", "查看商品详情页的服务保障栏，确认是否带有“7天无理由退货”服务标识，以及卖家“不支持”的表述是否显著。", "如果商品属于平台要求必须支持七天无理由退货的品类，可以向平台发起维权，并提交详情页截图等证据，说明卖家单方标注不支持的情况。", "注意退货申请的时间限制，自签收商品之日起七天内发出申请，并保持商品完好、配件齐全。"], "disclaimer": "以上为平台规则原文摘录与理解，不构成法律意见。最终以平台判定为准。", "_dedup_removed": 0, "_checks": {"quote_ok": true, "bad_words": [], "sanitized": 0, "repaired": 0, "dropped": 0, "n_quote_sources": 28, "n_clauses": 28, "n_known": 2, "n_unknown": 6, "n_favorable": 3}}}}, {"q": "京东买的包，防伪码刮开了能退吗", "a": {"ok": true, "routed": true, "lib": "京东售后政策（自营） + 京东自营各类目售后服务细则 + 京东售后服务总则（自营）", "lib_url": "https://help.jd.com/user/issue/list-112.html", "sit": {"item": "包", "channel": "京东", "state": "防伪码刮开", "want": "退货"}, "res": {"situation": "我理解你的情况是：在京东买的包，防伪码已经刮开，想知道还能不能退货。", "known": [{"id": "JD7", "quote": "商品有防伪码的，防伪码一经刮开不支持7天无理由退货", "why": "这条直接提到防伪码刮开与7天无理由退货的关系，和你刮开防伪码的情况直接相关。", "article": "各类目售后服务细则 · 注意事项"}], "unknown": [{"id": "JD6", "quote": "箱包：7天无理由退货需保持无折痕变形、五金件无磨损划痕、包身无污渍、轮子完好、无磨损掉漆，吊牌完好", "why": "这条是箱包类具体的完好标准，除了防伪码，包本身的状态（如吊牌、五金件、污渍等）也会影响能否退货。", "article": " 际到货日期。", "why": "这条说明如何认定收货日期，关系到7天、15天等时限的计算。", "article": "服务总则 · 注1（收货日期认定）"}], "favorable": [{"id": "JDT2", "quote": "国家法律所规定的功能性故障或商品质量问题 经由生产厂家指定或特约售后服务中心检测确认，并出具检测报告或经京东售后确认属于商品质量问题。", "why": "表格写明：7日（含）内退货：是；15日（含）内换货：是；收取返回运费：否。如果是质量问题，在7日内可退货、15日内可换货，且不收取返回运费。", "article": "服务总则 · 退换类别一（质量问题）", "table": {"7日（含）内退货": "是", "15日（含）内换货": "是", "收取返回运费": "否", "备注": "当地无检测条件的请联系京东售后处理。"}}, {"id": "JD-CAT-924-N4.", "quote": "4.海尔品牌的产品如有质量问题，厂家售后可直接为客户更换；", "why": "如果你购买的是海尔品牌家电，有质量问题时厂家售后可直接更换，这可能是一条便捷途径。", "article": "家用电器 · 注意事项第4.条"}, {"id": "JD-CAT-924-N7.", "quote": "7.玻璃制品和易损制品，只是产品局部损坏，可由厂商直接补寄即可，无需全部退回；", "why": "如果家电是玻璃制品或易损制品且仅局部损坏，可由厂商补寄，无需全部退回。", "article": "家用电器 · 注意事项第7.条"}], "unclear": "条款没有明确家电的三包保修期具体多长，以及半年时点是否在保修期内；质量问题退货需要检测报告，但未说明检测费用由谁承担；7天无理由退货的完好标准中『齐全』未定义，拆封查验是否影响完好也未写明。", "advice": ["先查看商品详情页和购买时的售后政策，确认该家电的保修期限和退货规则。", "联系厂家指定或特约售后服务中心进行检测，取得检测报告或鉴定文件，确认是否属于质量问题。", "根据检测结果，在京东提交售后申请，质量问题可参考相关条款在7日内退货、15日内换货，并注意保留包装、赠品和凭证。"], "disclaimer": "以上为平台规则原文摘录与理解，不构成法律意见。最终以平台判定为准。", "_dedup_removed": 0, "_checks": {"quote_ok": true, "bad_words": [], "sanitized": 0, "repaired": 0, "dropped": 0, "n_quote_sources": 108, "n_clauses": 108, "n_known": 2, "n_unknown": 8, "n_favorable": 3}}}}, {"q": "淘宝买的二手手机，用了一天想退", "a": {"ok": true, "routed": true, "lib": "淘宝网七天无理由退货规范 + 淘宝平台争议处理规则", "lib_url": "https://rulechannel.taobao.com/?type=detail&ruleId=5507&cId=1150#/rule/detail?ruleId=5507&cId=1150", "sit": {"item": "二手手机", "channel": "淘宝", "state": "用了一天", "want": "退货"}, "res": {"situation": "你在淘宝买了二手手机，用了一天想退货。", "known": [{"id": "T6A", "quote": "七、二手、竞拍商品；", "why": "二手商品被列在不支持七天无理由退货的类别里，这是商家或平台常用来回绝的理由。", "article": "第六条 · 不支持七天无理由退货的 8 类"}], "unknown": [{"id": "T1", "quote": "“七天无理由退货”服务是指买家购买带有“7天无理由退货”服务标识的商品后，自签收商品之日起七天内，对支持七天无理由退货并符合完好标准的商品，可向卖家发起七天无理由退货申请，卖家在规定时效内向买家提供退货的售后保障服务。", "why": "这条讲的是七天无理由退货服务的前提：商品要带服务标识、在签收后七天内、且符合完好标准。你的情况涉及二手手机，是否带标识、是否完好会影响这条的适用。", "article": "第一条"}, {"id": "T2", "quote": "支持七天无理由退货的商品，在商品详情页的服务保障栏会带服务标识，具体以商品详情页展示为准。", "why": "这条说明商品是否支持七天无理由退货，要看商品详情页有没有服务标识。你可以去查看当时购买页面的展示。", "article": "第二条"}, {"id": "T3", "quote": "选择无理由退货的买家应当自收到商品之日起七天内向淘宝网卖家发出退货申请（自物流显示签收商品的次日零时起计算，满168小时为七天）；买家退回的商品应当完好。", "why": "这条讲的是发起无理由退货的时间窗口和商品完好的要求。你用了一天，时间上还在七天内，但商品是否完好需要对照标准判断。", "article": "第三条"}, {"id": "I1", "quote": "商品能够保持原有品质、功能；买家应当确保退回商品和相关配（附）件（如吊牌、说明书、三包卡等）齐全，并保持原有品质、功能，无受损、受污、刮开防伪、产生激活（授权）等情形，无难以恢复原状的外观类使用痕迹、不合理的个人数据使用痕迹；", "why": "这条讲的是商品完好的具体标准，包括无使用痕迹、配件齐全等。你用了一天，手机是否有使用痕迹、配件是否齐全，会关系到完好标准的认定。", "article": "实施细则 · 通用完好标准（一）"}, {"id": "I2", "quote": "买家基于查验需要而打开商品包装，或者为确认商品的品质、功能而进行合理的调试不影响商品的完好。对超出查验和确认商品品质、功能需要而使用商品，导致商品价值贬损较大的，视为商品不完好；", "why": "这条区分了“查验需要的拆封调试”和“超出需要的使用”。你用了一天，属于哪种情形，可能影响完好判断。", "article": "实施细则 · 通用完好标准（二）"}, {"id": "TBZ7", "quote": "买卖双方就交易商品或服务有约定的，优先从约定；未约定或约定不明的，双方可协议补充；无法达成补充协议的，淘宝将按照本规则进行处理，本规则有特别规定的优先从特别规定。若仍无法确定争议责任归属的，淘宝将按照交易习惯处理或支持退货退款。支持退货退款的，发货运费由卖家承担，退货运费由买家承担。", "why": "这条讲的是有约定优先从约定，没有约定时平台按规则处理，仍无法确定责任时可能支持退货退款。你可以看看和卖家有没有关于退货的约定。", "article": "第七条"}, {"id": "TBZ8", "quote": "争议过程中，买卖双方应按本规则规定进行举证。本规则未有规定或淘宝发现双方的交易或一方账号异常的，淘宝将视双方实际情形作出举证责任分配。", "why": "这条讲的是争议中双方要举证，平台可能根据实际情况分配举证责任。你保留好商品状态、聊天记录等证据会有帮助。", "article": "第八条"}, {"id": "TBZ9", "quote": "买卖双方应自行对证据的真实性、关联性、完整性、准确性和及时性负责，淘宝将基于普通人的认知，根据该等证据作出纠纷责任的归属认定及纠纷调处的结论。", "why": "这条讲的是平台基于普通人认知根据证据判断责任。你提供的证据是否完整、及时，会影响平台判断。", "article": "第九条"}, {"id": "TBZ13", "quote": "卖家表述的对买家有重大利害关系的格式条款内容应显著，且不得低于淘宝平台规则要求，同时不存在免除卖家自身应承担的责任、加重买家责任、排除买家主要权利等内容，否则该条款无效。", "why": "这条讲的是卖家单方设置的格式条款如果对买家有重大利害关系且不显著、低于平台规则要求等，可能无效。如果卖家以某些告示拒绝退货，可以对照这条看看。", "article": "第十三条"}], "favorable": [{"id": "T4", "quote": "赠品遗失或破损、发票遗失不影响商品退货；赠品破损或遗失作折价处理，发票遗失由买家承担相应税款；淘宝网要求支持七天无理由退货的商品，卖家单方或买卖双方约定不支持七天无理由退货的行为无效，但平台以普通人认知判断买家为非生活消费所需购买的情形除外。鼓励卖家向买家提供更优于淘宝网要求的七天无理由退货要求。", "why": "这条讲的是平台要求支持七天无理由退货的商品，卖家单方或双方约定不支持的行为无效，且鼓励卖家提供更优条件。如果这个二手手机属于平台要求支持七天无理由退货的范围，卖家自行标注“不支持”可能不产生效力。", "article": "第四条"}, {"id": "T6C", "quote": "十一、除以上十类商品外的所有品类商品，均需支持“七天无理由退货”。服装服饰(除贴身用品)、食品类（非鲜活易腐类的）数码产品及配件、家纺居家日用、母婴用品（除食品、贴身用品）、宠物用品（除食品、药品）、图书、珠宝钻石类、家具、家电等。", "why": "这条讲的是除列明的十类商品外，其余所有品类均需支持七天无理由退货，并举例包括数码产品及配件。手机属于数码产品，但你的商品是二手，是否落入前面“二手、竞拍商品”的除外类别，需要结合商品性质判断。", "article": "第六条 · 必须支持的（其余所有品类）"}, {"id": "TBZ21", "quote": "因卖家责任交易支持退货退款的，若符合下述任一情形，除双方另有约定或平台规则另有规定外，交易支持退款买家。1、经买卖双方协商一致退款；2、无法或无需退回的虚拟商品，或服务类交易；3、无法退还商品且完全无法实现交易目的。", "why": "这条讲的是因卖家责任支持退货退款时，符合特定情形可支持退款买家，包括双方协商一致退款。如果你能和卖家协商一致，这条有参考意义。", "article": "第二十一条"}], "unclear": "二手手机被列在不支持七天无理由退货的类别中，但平台又规定除十类商品外均需支持七天无理由退货，且卖家单方约定不支持的行为无效（非生活消费所需除外）。二手手机究竟按哪一条处理，条款没有写清；另外，你用了一天是否超出“查验需要”而导致商品不完好，也需要结合实际情况确认。", "advice": ["先查看商品详情页当时有没有“7天无理由退货”服务标识，并截图保存。", "保留好手机当前状态的照片、聊天记录、订单和物流签收时间，确认是否在签收后七天内。", "可以尝试和卖家协商退货退款，看双方能否达成一致；协商时注意保留沟通记录。", "如果协商不成，可在平台规定的时限内在线发起维权，并按平台要求提交证据。"], "disclaimer": "以上为平台规则原文摘录与理解，不构成法律意见。最终以平台判定为准。", "_dedup_removed": 0, "_checks": {"quote_ok": true, "bad_words": [], "sanitized": 0, "repaired": 0, "dropped": 0, "n_quote_sources": 28, "n_clauses": 28, "n_known": 1, "n_unknown": 9, "n_favorable": 3}}}}, {"q": "淘宝买的东西，第8天才想退", "a": {"ok": true, "routed": true, "lib": "淘宝网七天无理由退货规范 + 淘宝平台争议处理规则", "lib_url": "https://rulechannel.taobao.com/?type=detail&ruleId=5507&cId=1150#/rule/detail?ruleId=5507&cId=1150", "sit": {"item": null, "channel": "淘宝", "state": null, "want": "退货"}, "res": {"situation": "你在淘宝买了东西，到第8天才想申请退货，想了解七天无理由退货规则下你的情况怎么处理。", "known": [{"id": "T1", "quote": "“七天无理由退货”服务是指买家购买带有“7天无理由退货”服务标识的商品后，自签收商品之日起七天内，对支持七天无理由退货并符合完好标准的商品，可向卖家发起七天无理由退货申请，卖家在规定时效内向买家提供退货的售后保障服务。", "why": "这是七天无理由退货的定义，商家常用“7天无理由”来宣传，你可能听过这个说法。", "article": "第一条"}, {"id": "T3", "quote": "选择无理由退货的买家应当自收到商品之日起七天内向淘宝网卖家发出退货申请（自物流显示签收商品的次日零时起计算，满168小时为七天）；买家退回的商品应当完好。", "why": "这条讲的是申请退货的时间起算点和完好要求，和你“第8天才想退”直接相关。", "article": "第三条"}], "unknown": [{"id": "T2", "quote": "支持七天无理由退货的商品，在商品详情页的服务保障栏会带服务标识，具体以商品详情页展示为准。", "why": "你可能没注意商品详情页有没有“7天无理由退货”标识，这关系到你的商品是否适用该服务。", "article": "第二条"}, {"id": "T6A", "quote": "一、买家定作的，定制类商品；个性定制、设计服务；二、鲜活易腐类商品；鲜花绿植、水产肉类、新鲜蔬果、宠物、巧克力、月饼、粽子、速冻冷鲜类食品等；三、在线下载或者买家拆封的音像制品，计算机软件等数字化商品；网游、话费、数字阅读、网络服务、电子凭证；四、交付的报纸、期刊；订阅的报纸、期刊；五、服务类商品；本地服务、代购服务；六、个人闲置类物品；/七、二手、竞拍商品；/八、人体用药", "why": "这条列举了不支持七天无理由退货的商品类别，你可以对照自己买的东西是否属于这些类别。", "article": "第六条 · 不支持七天无理由退货的 8 类"}, {"id": "T6B", "quote": "九、一经激活或者试用后价值贬损较大的商品，商用商品，或者短期内价值频繁波动的商品；智能商品、商用厨电、黄金等；十、拆封后影响人身安全或者生命健康的商品，或者拆封后易导致商品品质发生改变的商品；食品、保健品、贴身用品、成人用品、酒水等；", "why": "这些是卖家可以选择不支持七天无理由退货的商品，如果你的商品属于这类，卖家可能没有开通该服务。", "article": "第六条 · 卖家可选支持的 2 类"}, {"id": "T6C", "quote": "十一、除以上十类商品外的所有品类商品，均需支持“七天无理由退货”。服装服饰(除贴身用品)、食品类（非鲜活易腐类的）数码产品及配件、家纺居家日用、母婴用品（除食品、贴身用品）、宠物用品（除食品、药品）、图书、珠宝钻石类、家具、家电等。", "why": "这条说明除了前面十类，其他商品必须支持七天无理由退货，你可以看看自己的商品是否属于必须支持的品类。", "article": "第六条 · 必须支持的（其余所有品类）"}, {"id": "I1", "quote": "商品能够保持原有品质、功能；买家应当确保退回商品和相关配（附）件（如吊牌、说明书、三包卡等）齐全，并保持原有品质、功能，无受损、受污、刮开防伪、产生激活（授权）等情形，无难以恢复原状的外观类使用痕迹、不合理的个人数据使用痕迹；", "why": "这条讲商品完好的标准，退货时商品状态会影响是否符合无理由退货条件。", "article": "实施细则 · 通用完好标准（一）"}, {"id": "I2", "quote": "买家基于查验需要而打开商品包装，或者为确认商品的品质、功能而进行合理的调试不影响商品的完好。对超出查验和确认商品品质、功能需要而使用商品，导致商品价值贬损较大的，视为商品不完好；", "why": "这条说明拆封查验的边界，你如果已经拆封或使用过商品，可以对照看看是否超出查验需要。", "article": "实施细则 · 通用完好标准（二）"}, {"id": "TBZ4", "quote": "买家应在淘宝规定的时限内在线发起维权。", "why": "这条讲争议维权的受理期限，你第8天才想退，可能涉及是否还在维权时限内的问题。", "article": "第四条"}, {"id": "TBZ6", "quote": "淘宝受理买卖双方在淘宝平台上产生的交易争议处理申请，但出现以下情形的，淘宝可不予受理，买卖任一方有权自行通过司法机关等途径向相对方主张权利：（一）买家未在本规则规定的受理期限内发起维权；（二）交易订单显示的商品或服务与买卖双方约定的实际交易商品或服务不一致，导致交易事实无法查清；（三）买卖双方经自行协商达成退款或退货退款协议并履行完毕，一方或双方反悔产生争议；（四）买卖双方进行虚假交易或利用信用卡、花呗等实施套现且交易成功；（五）交易做退款处理后，因卖家需要取回商品产生争议；（六）除淘宝平台规则规定的情形外，买家主张交易引发的额外损失或法定赔偿事宜。", "why": "这条说明哪些情形淘宝可能不予受理，其中第一项就是未在受理期限内发起维权，和你超时的情况相关。", "article": "第六条"}], "favorable": [{"id": "T4", "quote": "赠品遗失或破损、发票遗失不影响商品退货；赠品破损或遗失作折价处理，发票遗失由买家承担相应税款；淘宝网要求支持七天无理由退货的商品，卖家单方或买卖双方约定不支持七天无理由退货的行为无效，但平台以普通人认知判断买家为非生活消费所需购买的情形除外。鼓励卖家向买家提供更优于淘宝网要求的七天无理由退货要求。", "why": "这条鼓励卖家提供比平台规则更长的退货期限，如果卖家有更优承诺，对你可能有利。", "article": "第四条"}, {"id": "TBZ5", "quote": "以下几种情形不受受理期限限制：（一）行政机关认定为假冒或违禁商品；（二）买家提供司法机关出具的生效法律文书；（三）买家未在淘宝规定的时限内在线发起维权，但能够提供凭证证实未收到货、商品存在品质等相关问题；（四）卖家承诺或双方另行约定售后服务期限。", "why": "如果你有商品品质问题或卖家另有售后承诺，即使超过7天，也可能不受受理期限限制，这对你有利。",     for (let i = 0; i < s.length - 1; i++){
      const g = s.slice(i, i + 2);
      m.set(g, (m.get(g) || 0) + 1);
    }
    return m;
  }
  function dice(a, b){
    const A = bigrams(norm(a)), B = bigrams(norm(b));
    let inter = 0, total = 0;
    A.forEach((v, k) => { total += v; if (B.has(k)) inter += Math.min(v, B.get(k)); });
    B.forEach(v => { total += v; });
    return total ? (2 * inter) / total : 0;
  }
  function matchCase(q){
    let best = null, score = 0;
    for (const c of DEMO_CASES){
      const s = dice(q, c.q);
      if (s > score){ score = s; best = c; }
    }
    return score >= 0.42 ? best : null;
  }
  const resp = o => Promise.resolve({ ok: true, json: () => Promise.resolve(o) });

  window.fetch = function(url, opts){
    const u = String(url);
    if (u.indexOf("/api/libs") >= 0) return resp(DEMO_LIBS);
    if (u.indexOf("/api/ask") >= 0){
      let q = "";
      try { q = (JSON.parse((opts && opts.body) || "{}").text) || ""; } catch(e){}
      const hit = matchCase(q);
      if (hit) return resp(hit.a);
      return resp({
        ok: true, routed: false, reason: "demo_miss", sit: {},
        msg: "离线演示版只预生成了 " + DEMO_CASES.length + " 个案例的真实结果，这句话没有命中。"
           + "点上方的示例看效果；想用自己的问题，需要跑真实版本（源码在交付包里，填自己的 API Key 即可）。"
      });
    }
    return resp({});
  };
})();
</script>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => (s ?? "").toString().replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

  const EXAMPLES = ["淘宝买的牛仔裤，吊牌剪了，试穿发现太长想退", "淘宝买的耳机，拆封了发现不喜欢", "淘宝退货后，商家说外观有划痕要扣钱", "淘宝卖家详情页写了不支持七天无理由，我能退吗", "京东买的包，防伪码刮开了能退吗", "京东买的包，吊牌剪了想退"];

  fetch("/api/libs").then(r => r.json()).then(d => {
    const total = d.reduce((a, x) => a + (x.n || 0), 0);
    $("navmeta").innerHTML = "<b>" + d.length + "</b> 个条例库 · <b>" + total + "</b> 条";
    $("chips").innerHTML = EXAMPLES.map(e =>
      `<button class="chip" data-q="${esc(e)}">${esc(e.length > 18 ? e.slice(0,18) + "…" : e)}</button>`).join("");
    $("chips").querySelectorAll(".chip").forEach(b => {
      b.onclick = () => { $("q").value = b.dataset.q; $("q").focus(); };
    });
  }).catch(() => { $("navmeta").textContent = "条例库未加载"; });

  function itemHTML(m, cls){
    const tbl = m.table && Object.keys(m.table).length
      ? `<div class="tbl">${Object.entries(m.table).map(([k,v]) =>
          `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("")}</div>` : "";
    return `<div class="it ${cls}">
      <div class="art">${esc(m.article || m.id)}<span class="badge">原文</span></div>
      <div class="q">「${esc(m.quote)}」</div>
      ${tbl}
      ${m.why ? `<div class="why">${esc(m.why)}</div>` : ""}
    </div>`;
  }

  function group(kind, title, sub, items, cls){
    if(!items || !items.length) return "";
    return `<div class="group">
      <div class="group-h">
        <span class="dot ${kind}"></span>
        <h3>${title}</h3>
        <span class="cnt">${items.length} 条</span>
      </div>
      ${sub ? `<div class="group-sub">${sub}</div>` : ""}
      <div class="items">${items.map(m => itemHTML(m, cls)).join("")}</div>
    </div>`;
  }

  const STAGES = ["按平台匹配条例库", "把相关条款逐条摘出来", "分成三组并标出没说清的地方"];
  let timers = [];
  function showLoading(){
    $("out").innerHTML = `<div class="loading" role="status">
      ${STAGES.map((s,i) => `<div class="stage" data-i="${i}"><i></i><span>${esc(s)}</span></div>`).join("")}
      <div class="sk" style="width:52%;height:40px;margin-top:16px"></div>
      <div class="sk" style="width:86%"></div>
      <div class="sk" style="width:74%"></div>
      <div class="sk" style="width:80%"></div>
    </div>`;
    const mark = (n) => {
      document.querySelectorAll(".loading .stage").forEach(el => {
        if(+el.dataset.i < n) el.classList.add("done");
      });
    };
    timers = [setTimeout(() => mark(1), 900), setTimeout(() => mark(2), 3200)];
    return { stop(){ timers.forEach(clearTimeout); } };
  }

  let busy = false;
  function setBusy(b){
    busy = b;
    $("go").disabled = b;
    $("go").textContent = b ? "检索中" : "查看相关条款";
  }

  $("go").onclick = async () => {
    if(busy) return;
    const v = $("q").value.trim();
    if(!v){ $("q").focus(); return; }
    setBusy(true);
    const loading = showLoading();

    try {
      const r = await fetch("/api/ask", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({text:v})
      });
      const d = await r.json();
      loading.stop(); setBusy(false);

      if(d.err){
        $("out").innerHTML = `<div class="err"><b>出错了</b><br>${esc(d.err)}
          <div><button class="btn" id="retry">再试一次</button></div></div>`;
        $("retry").onclick = () => $("go").click();
        return;
      }

      if(!d.routed){
        const icon = {out_of_scope:"范围外", platform_not_covered:"未收录", need_more_info:"信息不足", demo_miss:"演示未命中"}[d.reason] || "未处理";
        $("out").innerHTML = `<div class="empty">
          <b>${esc(icon)}</b>
          <p>${esc(d.msg)}</p>
          <div class="libs">换一个具体的说法试试，例如：淘宝买的耳机，拆封了发现不喜欢</div>
        </div>`;
        return;
      }

      const res = d.res, sit = d.sit || {};
      const tags = [["item","买的是"],["channel","在哪买"],["state","状态"],["want","想要"]]
        .filter(([k]) => sit[k])
        .map(([k,cn]) => `${cn} <b>${esc(sit[k])}</b>`).join("　／　");

      $("out").innerHTML = `
        <div class="bar">
          <h2>相关条款</h2>
          <div class="lib">${esc(d.lib)} · <a href="${esc(d.lib_url)}" target="_blank" rel="noopener">查看原文</a></div>
        </div>

        <div class="situation">
          <div class="lbl">我理解你的情况</div>
          ${esc(res.situation || "")}
          ${tags ? `<div class="tags">${tags}</div>` : ""}
        </div>

        ${group("know","你可能已经知道的","商家常用的，或者大众普遍知道的那几条",res.known,"")}
        ${group("unk","你可能不知道的","藏在实施细则、附则、分类表里，一般不会主动告诉你",res.unknown,"unk")}
        ${group("fav","对你有利的","明确限制商家，或给你留了余地的条款",res.favorable,"fav")}

        ${res.unclear ? `<div class="group">
          <div class="group-h"><span class="dot gap"></span><h3>条款没说清的</h3></div>
          <div class="callout gap" style="margin-top:10px">
            <span class="t">需要你自己确认</span>${esc(res.unclear)}
          </div>
        </div>` : ""}

        ${res.advice && res.advice.length ? `<div class="group">
          <div class="group-h"><span class="dot know"></span><h3>建议</h3></div>
          <ol class="adv">${res.advice.map(a => `<li>${esc(a)}</li>`).join("")}</ol>
        </div>` : ""}

        <div class="foot">
          <div class="src">出处：<a href="${esc(d.lib_url)}" target="_blank" rel="noopener">${esc(d.lib)}</a></div>
          <div style="margin-top:6px">${esc(res.disclaimer || "以上为平台规则原文摘录与理解，不构成法律意见。最终以平台判定为准。")}</div>
        </div>`;

      const bar = $("out").querySelector(".bar");
      if(bar) bar.scrollIntoView({behavior:"smooth", block:"start"});
    } catch(e){
      loading.stop(); setBusy(false);
      $("out").innerHTML = `<div class="err"><b>请求失败</b><br>${esc(e.message)}
        <div><button class="btn" id="retry">再试一次</button></div></div>`;
      $("retry").onclick = () => $("go").click();
    }
  };

  $("q").addEventListener("keydown", e => {
    if((e.metaKey || e.ctrlKey) && e.key === "Enter") $("go").click();
  });
})();
</script>
</body>
</html>
